[project]
name = "zhouxu-harness"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
rag = ["numpy>=1.26,<3", "torch>=2.4,<3", "transformers>=4.44,<5"]
materials = [
  "beautifulsoup4>=4.12,<5",
  "openpyxl>=3.1,<4",
  "Pillow>=10,<12",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "pytesseract>=0.3,<1",
]

[dependency-groups]
dev = [
    "numpy>=1.26,<3",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:cacheprovider"
markers = ["live: explicit paid DeepSeek API verification (--live)"]

[tool.ruff]
target-version = "py311"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
