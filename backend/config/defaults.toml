name = "dynamic_rag_search"
result_budget_chars = 9000
# 0: bounded by Harness rounds/time, without an additional fixed call quota.
max_calls_per_run = 0
description = """
舟序自研法规知识库，取得已接入法规的原文、适用条件、例外、版本和来源，也可返回对当前判断有用的部分参考。它不是附件读取器、案例库或通用事实查询器。
当用户需要准确条文/核验，或当前判断存在会影响交付的具体规则疑点而本库能提供帮助时，主动查询，用户无需说“查知识库”。已有资料和知识足以完成的一般说明、整理、草稿可以直接交付，不要求每个专业知识点都查。
query必填，结合原目标与历史写成独立的简短检索子任务。可用document_name限定法规；location只填用户明确给出、上下文可计算或本轮证据出现的位置，不能凭记忆猜条号。没有准确位置时用content_query和少量anchors表达缺口，不把多个无关要点塞进一个定位范围。
version_scope的all/current/historical是库内范围；尊重材料时间语境，必要年份写入query，不能将库内标记当法律适用结论。
返回status、sufficiency、missing_aspects和正文。充分性仅针对本次子查询，不代表用户整体任务完成；不足时已有相关内容仍可参考，但不能证明未支持的命题。已有回执优先复用，只有新增结果会影响当前交付时再查，不为补全全部背景扩展研究。无命中不证明不存在；服务故障不等于用户缺资料。
学理通说、条约参加事实、私人事件、实时统计不是本库法规正文能直接证明的对象；相关法规可以辅助理解，但不能用它们冒充这些事实的证明。引用实际正文的人可读来源，不输出内部索引。调用额度：{max_calls}。
"""

