搜索本次运行绑定的材料正文，返回多个匹配位置和短摘录；可把返回的 material_id、unit_id、char_offset 交给 read_material 读取附近原文。
query 使用简短的正文关键词或短语；material_ids 可限定已提供的材料，不填则搜索当前绑定材料。
这是用户材料搜索，不是法规库搜索，也不是事实核验。匹配仅表示文字定位，不代表证据充分。
用户要求开头、末尾或按顺序处理全部内容时，优先直接读取；不要将范围描述当关键词搜索，也不必先搜索才能读取。
需要比较多个位置时可一次提出多个读取请求；已有足够原文时不重复搜索。
next_cursor 用于获取其余匹配；无命中只说明已解析文字未匹配，不能声称原件不存在内容。不得向用户展示内部位置ID。
"""
