delivery_description = "交付用户需要的正文；text只包含用户可读内容。status=completed表示本次约定的交付完成，包括用户明确允许的如实说明无法获取信息；continuing表示可用阶段成果和仍可执行的剩余工作；blocked表示系统故障阻碍原目标且没有约定替代交付。故障说明不是阶段成果。必须用户提供关键事实时改用补充工具；可自行读取的信息用现有工具取得。"
